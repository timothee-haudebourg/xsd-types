[package]
name = "xsd-types"
version = "0.9.6"
edition = "2021"
authors = ["Timothée Haudebourg <author@haudebourg.net>"]
description = "XSD data types."
categories = ["data-structures"]
keywords = ["xsd", "w3c", "datatype"]
repository = "https://github.com/timothee-haudebourg/xsd-types"
documentation = "https://docs.rs/xsd-types"
license = "MIT/Apache-2.0"
readme = "README.md"
rust-version = "1.87"

[features]
serde = ["dep:serde"]
chrono = ["dep:chrono"]
large-dates = ["time/large-dates"]

[dependencies]
iref = "4.0"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2.15"
ordered-float = "3.4.0"
time = "0.3"

# Minor
lazy_static = "1.4.0"
once_cell = "1.17.0"
thiserror = "1.0.38"
pretty_dtoa = "0.3.0"
str-newtype = "3.0"
static-automata = "1.0.3"

# Optional
chrono = { version = "0.4.26", optional = true }
serde = { version = "1.0", optional = true }